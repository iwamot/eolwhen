name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string

permissions: {}

jobs:
  release:
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
      cancel-in-progress: false
    uses: iwamot/workflows/.github/workflows/release-homebrew-tap.yml@7b091fa5fb18e6dc84145fa54fd45ff94e139cd0 # v8.18.0
    with:
      tag: ${{ inputs.tag || '' }}
    permissions:
      checks: read  # allow the shared release workflow to inspect required CI
      statuses: read  # allow inspection of required legacy commit statuses
      contents: write  # to draft and publish the GitHub Release and upload binary archives
      id-token: write  # to mint OIDC token for attestation
      attestations: write  # to write the provenance attestation
      artifact-metadata: write  # to record artifact metadata for the attestation
    secrets:
      homebrew_tap_app_client_id: ${{ secrets.HOMEBREW_TAP_APP_CLIENT_ID }}
      homebrew_tap_app_private_key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
